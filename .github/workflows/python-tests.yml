name: Python Tests

on:
  push:
    branches:
      - master
      - dev
  pull_request_target:
    branches:
      - master
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', ]

    services:
      debian:
        image: debian:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.3
      with:
        submodules: "recursive"

    - name: Set up Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        make install

    - name: Run lint
      run: |
        make format

    - name: Run tests
      run: |
        make test

    - name: Run doctests
      run: |
        make doctest
